services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy/conf:/etc/caddy
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

  waterheaterserver:
    image: waterheaterserver:latest
    build:
      context: ./waterheaterserver
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"

volumes:
  caddy_data:
  caddy_config:
