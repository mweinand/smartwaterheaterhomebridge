services:
  proxy:
    image: proxy:latest
    build:
      context: ./proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  waterheaterserver:
    image: waterheaterserver:latest
    build:
      context: ./waterheaterserver
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      CSV_LOG_RETENTION: ${CSV_LOG_RETENTION:-90}
    volumes:
      - ./waterheaterserver/logs:/app/logs
