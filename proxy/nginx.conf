# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /dev/stderr info;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

stream {
    log_format proxy_stream '$remote_addr [$time_local] $protocol $status '
                            '$bytes_sent $bytes_received $session_time $upstream_addr '
                            '$ssl_protocol $ssl_cipher';
    access_log /dev/stdout proxy_stream;

    server {
        listen                443 ssl;
        proxy_pass            waterheaterserver:8001;

        ssl_certificate       /etc/nginx/energysmartwaterheater.com.crt;
        ssl_certificate_key   /etc/nginx/energysmartwaterheater.com.key;
        ssl_protocols         SSLv3 TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers           HIGH:!aNULL:!MD5:@SECLEVEL=0;
        ssl_session_cache     shared:SSL:20m;
        ssl_session_timeout   4h;
        ssl_handshake_timeout 30s;
     }
}